name: Bootstrap Aidoku extensions

on:
  push:
    branches:
      - aidoku-extensions
    paths:
      - aidoku-source.zip
      - .github/workflows/bootstrap-aidoku.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Expand source bundle
        run: |
          if [ ! -f aidoku-source.zip ]; then
            echo "No source bundle; nothing to do."
            exit 0
          fi
          unzip -o aidoku-source.zip
          rm aidoku-source.zip
          rm -rf aidoku/sources/en.r2-library
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Aidoku sources"
          git push
