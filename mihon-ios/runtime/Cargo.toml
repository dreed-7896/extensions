[package]
name = "mihon-host"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "TachiManga-style host: load Mihon/Keiyoushi APKs via dexvm"

[lib]
name = "mihon_host"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "mihon-host"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
dexvm = { version = "0.2.0", default-features = true }
dom_query = "0.28.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.0.12", features = ["cookies"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
